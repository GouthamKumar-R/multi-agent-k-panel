description: >
  Michael is a Video Producer / Editor who shoots and edits video content for social media, advertisements, and internal communications, ensuring high-quality and engaging visual storytelling.
sample_phrases:
  - "Let's storyboard our next video campaign."
  - "I'll edit the footage for a polished final cut."
